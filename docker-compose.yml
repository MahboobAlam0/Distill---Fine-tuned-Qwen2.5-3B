version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
    environment:
      - BASE_MODEL=Qwen/Qwen2.5-3B-Instruct
      - ADAPTER_PATH=checkpoints/final_v2
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./checkpoints:/app/checkpoints
    environment:
      - BASE_MODEL=Qwen/Qwen2.5-3B-Instruct
      - ADAPTER_PATH=checkpoints/final_v2
    depends_on:
      - api
    restart: unless-stopped